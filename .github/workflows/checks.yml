name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    # The Safari-engine run reports problems but does not block a merge until it has proved stable.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: |
          cat data.js sync.js extras.js app.js > /tmp/all.js
          node --check /tmp/all.js
      - name: Run the phone emulator checks
        working-directory: tests
        run: npm test
